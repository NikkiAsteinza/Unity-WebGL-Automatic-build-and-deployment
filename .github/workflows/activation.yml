name: Activate Unity license (recommended) 🔐
on: [workflow_dispatch]

jobs:
  activate:
    name: Activate Unity via secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Activate Unity
        uses: game-ci/unity-activate@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}   # pega aquí el contenido del .ulf
          # UNITY_EMAIL / UNITY_PASSWORD solo si tu flujo lo requiere
        with:
          unityVersion: 2022.3.59f1
